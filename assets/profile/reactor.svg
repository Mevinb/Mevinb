<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-labelledby="title desc">
<title id="title">ReactorX — Local image processing.</title>
<desc id="desc">Original schematic artwork for Mevin Benty's profile. Decorative motion, not live measurements.</desc>
<defs>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#687382" stroke-opacity=".10"/></pattern>
<clipPath id="bounds"><rect width="1000" height="300"/></clipPath>
</defs>
<style>
text{font-family:Arial,Helvetica,sans-serif}
.mono{font-family:'Courier New',monospace;letter-spacing:2px}
.orbit{transform-origin:750px 300px;animation:orbit 36s linear infinite}
.reverse{animation-direction:reverse;animation-duration:48s}
.flow{stroke-dasharray:5 14;animation:flow 12s linear infinite}
.breathe{animation:breathe 6s ease-in-out infinite}
@keyframes orbit{to{transform:rotate(360deg)}}
@keyframes flow{to{stroke-dashoffset:-190}}
@keyframes breathe{50%{opacity:.35}}
@media(prefers-reduced-motion:reduce){.orbit,.flow,.breathe{animation:none!important}}
</style>
<g clip-path="url(#bounds)"><rect width="1000" height="300" fill="#0B0D10"/><rect x="610" width="390" height="300" fill="url(#grid)"/><path d="M610 0L610 300" stroke="#343B46" /><text x="34" y="43" fill="#B8C0CC" font-size="13" font-weight="400" class="mono">01 / SELECTED WORK</text><text x="32" y="122" fill="#F5F7FA" font-size="65" font-weight="700" letter-spacing="-3">ReactorX</text><text x="35" y="165" fill="#B8C0CC" font-size="21" font-weight="400" >Local image processing.</text><text x="35" y="252" fill="#B8C0CC" font-size="13" font-weight="400" class="mono">PYTHON / ONNX / GRADIO</text><text x="564" y="254" fill="#DCE3EC" font-size="32" font-weight="400" >↗</text><g fill="none" stroke="#687382" stroke-width="1"><path d="M674 55Q790 150 674 247" opacity=".65"/><path d="M690 55Q785 150 690 247" opacity=".65"/><path d="M706 55Q780 150 706 247" opacity=".65"/><path d="M722 55Q775 150 722 247" opacity=".65"/><path d="M738 55Q770 150 738 247" opacity=".65"/><path d="M754 55Q765 150 754 247" opacity=".65"/><path d="M770 55Q760 150 770 247" opacity=".65"/><path d="M786 55Q755 150 786 247" opacity=".65"/><path d="M802 55Q750 150 802 247" opacity=".65"/><path d="M818 55Q745 150 818 247" opacity=".65"/><path d="M834 55Q740 150 834 247" opacity=".65"/><path d="M850 55Q735 150 850 247" opacity=".65"/><path d="M674 63Q790 128.25 850 63"/><path d="M674 85Q790 133.75 850 85"/><path d="M674 107Q790 139.25 850 107"/><path d="M674 129Q790 144.75 850 129"/><path d="M674 151Q790 150.25 850 151"/><path d="M674 173Q790 155.75 850 173"/><path d="M674 195Q790 161.25 850 195"/><path d="M674 217Q790 166.75 850 217"/><path d="M674 239Q790 172.25 850 239"/></g><path class="flow" d="M645 151H953" fill="none" stroke="#DCE3EC" stroke-width="2"/><circle cx="703" cy="103" r="4" fill="#DCE3EC"/><circle cx="821" cy="103" r="4" fill="#DCE3EC"/><circle cx="762" cy="151" r="4" fill="#DCE3EC"/><circle cx="727" cy="207" r="4" fill="#DCE3EC"/><circle cx="798" cy="207" r="4" fill="#DCE3EC"/><text x="645" y="278" fill="#B8C0CC" font-size="12" font-weight="400" class="mono">DETECT → ALIGN → BLEND</text></g></svg>
