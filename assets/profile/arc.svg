<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-labelledby="title desc">
<title id="title">ARC — Models connected to tools.</title>
<desc id="desc">Original schematic artwork for Mevin Benty's profile. Decorative motion, not live measurements.</desc>
<defs>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#89927f" stroke-opacity=".10"/></pattern>
<clipPath id="bounds"><rect width="1000" height="300"/></clipPath>
</defs>
<style>
text{font-family:Arial,Helvetica,sans-serif}
.mono{font-family:'Courier New',monospace;letter-spacing:2px}
.orbit{transform-origin:750px 300px;animation:orbit 36s linear infinite}
.reverse{animation-direction:reverse;animation-duration:48s}
.flow{stroke-dasharray:5 14;animation:flow 12s linear infinite}
.breathe{animation:breathe 6s ease-in-out infinite}
@keyframes orbit{to{transform:rotate(360deg)}}
@keyframes flow{to{stroke-dashoffset:-190}}
@keyframes breathe{50%{opacity:.35}}
@media(prefers-reduced-motion:reduce){.orbit,.flow,.breathe{animation:none!important}}
</style>
<g clip-path="url(#bounds)"><rect width="1000" height="300" fill="#101310"/><rect x="610" width="390" height="300" fill="url(#grid)"/><path d="M610 0L610 300" stroke="#343c31" /><text x="34" y="43" fill="#a4aca0" font-size="13" font-weight="400" class="mono">03 / SELECTED WORK</text><text x="32" y="122" fill="#eef0e7" font-size="65" font-weight="700" letter-spacing="-3">ARC</text><text x="35" y="165" fill="#a4aca0" font-size="21" font-weight="400" >Models connected to tools.</text><text x="35" y="252" fill="#a4aca0" font-size="13" font-weight="400" class="mono">PYTHON / ROUTING / AUTOMATION</text><text x="564" y="254" fill="#c4f569" font-size="32" font-weight="400" >↗</text><g fill="none" stroke="#637653"><path d="M807 150Q680 150 680 64"/><path class="flow" d="M807 150Q680 150 680 64" stroke="#c4f569"/><rect x="663" y="47" width="34" height="34" fill="#101310"/><path d="M807 150Q925 150 925 65"/><path class="flow" d="M807 150Q925 150 925 65" stroke="#c4f569"/><rect x="908" y="48" width="34" height="34" fill="#101310"/><path d="M807 150Q938 150 938 231"/><path class="flow" d="M807 150Q938 150 938 231" stroke="#c4f569"/><rect x="921" y="214" width="34" height="34" fill="#101310"/><path d="M807 150Q674 150 674 235"/><path class="flow" d="M807 150Q674 150 674 235" stroke="#c4f569"/><rect x="657" y="218" width="34" height="34" fill="#101310"/><circle cx="807" cy="150" r="67"/><circle cx="807" cy="150" r="52" stroke="#c4f569"/><circle class="breathe" cx="807" cy="150" r="34" fill="#c4f569" stroke="none"/></g><text x="680" y="34" fill="#a4aca0" font-size="11" font-weight="400" text-anchor="middle" class="mono">MODEL</text><text x="915" y="34" fill="#a4aca0" font-size="11" font-weight="400" text-anchor="middle" class="mono">TOOLS</text><text x="680" y="279" fill="#a4aca0" font-size="11" font-weight="400" text-anchor="middle" class="mono">MEMORY</text><text x="922" y="279" fill="#a4aca0" font-size="11" font-weight="400" text-anchor="middle" class="mono">ACTION</text></g></svg>
