<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-labelledby="title desc">
<title id="title">PATHWISE — Different futures, made tangible.</title>
<desc id="desc">Original schematic artwork for Mevin Benty's profile. Decorative motion, not live measurements.</desc>
<defs>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#89927f" stroke-opacity=".10"/></pattern>
<clipPath id="bounds"><rect width="1000" height="300"/></clipPath>
</defs>
<style>
text{font-family:Arial,Helvetica,sans-serif}
.mono{font-family:'Courier New',monospace;letter-spacing:2px}
.orbit{transform-origin:750px 300px;animation:orbit 36s linear infinite}
.reverse{animation-direction:reverse;animation-duration:48s}
.flow{stroke-dasharray:5 14;animation:flow 12s linear infinite}
.breathe{animation:breathe 6s ease-in-out infinite}
@keyframes orbit{to{transform:rotate(360deg)}}
@keyframes flow{to{stroke-dashoffset:-190}}
@keyframes breathe{50%{opacity:.35}}
@media(prefers-reduced-motion:reduce){.orbit,.flow,.breathe{animation:none!important}}
</style>
<g clip-path="url(#bounds)"><rect width="1000" height="300" fill="#eef0e7"/><rect x="610" width="390" height="300" fill="url(#grid)"/><path d="M610 0L610 300" stroke="#bac3ae" /><text x="34" y="43" fill="#4c5844" font-size="13" font-weight="400" class="mono">04 / SELECTED WORK</text><text x="32" y="122" fill="#101310" font-size="65" font-weight="700" letter-spacing="-3">PATHWISE</text><text x="35" y="165" fill="#4c5844" font-size="21" font-weight="400" >Different futures, made tangible.</text><text x="35" y="252" fill="#4c5844" font-size="13" font-weight="400" class="mono">EXPO / REACT NATIVE / UI PROTOTYPE</text><text x="564" y="254" fill="#465e28" font-size="32" font-weight="400" >↗</text><g fill="none" stroke="#8c9c7d" stroke-width="2"><path d="M660 244C765 244 705 56 927 56"/><path d="M660 244C784 244 758 151 927 151"/><path d="M660 244H927"/></g><path class="flow" d="M660 244C765 244 705 56 927 56" fill="none" stroke="#465e28" stroke-width="3"/><circle cx="927" cy="56" r="20" fill="#101310"/><text x="927" y="62" fill="#c4f569" font-size="17" font-weight="700" text-anchor="middle">A</text><circle cx="927" cy="151" r="20" fill="#101310"/><text x="927" y="157" fill="#c4f569" font-size="17" font-weight="700" text-anchor="middle">B</text><circle cx="927" cy="244" r="20" fill="#101310"/><text x="927" y="250" fill="#c4f569" font-size="17" font-weight="700" text-anchor="middle">C</text><circle cx="660" cy="244" r="7" fill="#465e28"/></g></svg>
