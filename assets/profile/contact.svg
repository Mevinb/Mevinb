<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="210" viewBox="0 0 1000 210" role="img" aria-labelledby="title desc">
<title id="title">Let&#x27;s build it — contact Mevin Benty</title>
<desc id="desc">Original schematic artwork for Mevin Benty's profile. Decorative motion, not live measurements.</desc>
<defs>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#89927f" stroke-opacity=".10"/></pattern>
<clipPath id="bounds"><rect width="1000" height="210"/></clipPath>
</defs>
<style>
text{font-family:Arial,Helvetica,sans-serif}
.mono{font-family:'Courier New',monospace;letter-spacing:2px}
.orbit{transform-origin:750px 300px;animation:orbit 36s linear infinite}
.reverse{animation-direction:reverse;animation-duration:48s}
.flow{stroke-dasharray:5 14;animation:flow 12s linear infinite}
.breathe{animation:breathe 6s ease-in-out infinite}
@keyframes orbit{to{transform:rotate(360deg)}}
@keyframes flow{to{stroke-dashoffset:-190}}
@keyframes breathe{50%{opacity:.35}}
@media(prefers-reduced-motion:reduce){.orbit,.flow,.breathe{animation:none!important}}
</style>
<g clip-path="url(#bounds)"><rect width="1000" height="210" fill="#c4f569"/><text x="40" y="45" fill="#101310" font-size="14" font-weight="400" class="mono">THE NEXT INTERESTING THING</text><text x="36" y="124" fill="#101310" font-size="76" font-weight="700" letter-spacing="-4">Let&#x27;s build it.</text><text x="42" y="175" fill="#354427" font-size="20" font-weight="400" >mevinbenty507@gmail.com</text><path d="M830 143L931 42M835 42H931V138" fill="none" stroke="#101310" stroke-width="8"/></g></svg>
