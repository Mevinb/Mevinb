<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="650" viewBox="0 0 1000 650" role="img" aria-labelledby="title desc">
<title id="title">Mevin Benty — software, from interface to engine</title>
<desc id="desc">Original schematic artwork for Mevin Benty's profile. Decorative motion, not live measurements.</desc>
<defs>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#89927f" stroke-opacity=".10"/></pattern>
<clipPath id="bounds"><rect width="1000" height="650"/></clipPath>
</defs>
<style>
text{font-family:Arial,Helvetica,sans-serif}
.mono{font-family:'Courier New',monospace;letter-spacing:2px}
.orbit{transform-origin:750px 300px;animation:orbit 36s linear infinite}
.reverse{animation-direction:reverse;animation-duration:48s}
.flow{stroke-dasharray:5 14;animation:flow 12s linear infinite}
.breathe{animation:breathe 6s ease-in-out infinite}
@keyframes orbit{to{transform:rotate(360deg)}}
@keyframes flow{to{stroke-dashoffset:-190}}
@keyframes breathe{50%{opacity:.35}}
@media(prefers-reduced-motion:reduce){.orbit,.flow,.breathe{animation:none!important}}
</style>
<g clip-path="url(#bounds)"><rect width="1000" height="650" fill="#101310"/><rect width="1000" height="650" fill="url(#grid)"/><text x="40" y="47" fill="#c4f569" font-size="14" font-weight="400" class="mono">MB / INDEPENDENT BUILDER</text><text x="960" y="47" fill="#a4aca0" font-size="14" font-weight="400" text-anchor="end" class="mono">SOURCE OPEN ↗</text><path d="M40 68L960 68" stroke="#343c31" /><g fill="none" stroke="#728064" stroke-width="1"><circle cx="750" cy="300" r="100" opacity=".35"/><circle cx="750" cy="300" r="150" opacity=".35"/><circle cx="750" cy="300" r="200" opacity=".35"/><circle cx="750" cy="300" r="245" opacity=".35"/><ellipse cx="750" cy="300" rx="240" ry="85" transform="rotate(0 750 300)" opacity=".45"/><ellipse cx="750" cy="300" rx="240" ry="85" transform="rotate(20 750 300)" opacity=".45"/><ellipse cx="750" cy="300" rx="240" ry="85" transform="rotate(40 750 300)" opacity=".45"/><ellipse cx="750" cy="300" rx="240" ry="85" transform="rotate(60 750 300)" opacity=".45"/><ellipse cx="750" cy="300" rx="240" ry="85" transform="rotate(80 750 300)" opacity=".45"/><ellipse cx="750" cy="300" rx="240" ry="85" transform="rotate(100 750 300)" opacity=".45"/><ellipse cx="750" cy="300" rx="240" ry="85" transform="rotate(120 750 300)" opacity=".45"/><ellipse cx="750" cy="300" rx="240" ry="85" transform="rotate(140 750 300)" opacity=".45"/><ellipse cx="750" cy="300" rx="240" ry="85" transform="rotate(160 750 300)" opacity=".45"/></g><g class="orbit" fill="none" stroke="#c4f569"><ellipse cx="750" cy="300" rx="245" ry="91" transform="rotate(-30 750 300)"/><circle cx="995" cy="300" r="5" fill="#c4f569"/></g><g class="orbit reverse" fill="none" stroke="#c4f569" stroke-opacity=".5"><ellipse cx="750" cy="300" rx="182" ry="240"/><circle cx="750" cy="60" r="4" fill="#c4f569"/></g><text x="34" y="233" fill="#eef0e7" font-size="164" font-weight="900" letter-spacing="-11">MEVIN</text><text x="40" y="370" fill="#eef0e7" font-size="164" font-weight="900" letter-spacing="-11">BENTY</text><rect x="43" y="404" width="62" height="5" fill="#c4f569"/><text x="42" y="463" fill="#eef0e7" font-size="35" font-weight="400" >Software, from</text><text x="42" y="506" fill="#eef0e7" font-size="35" font-weight="400" >interface to engine.</text><text x="750" y="308" fill="#c4f569" font-size="38" font-weight="700" text-anchor="middle">m/b</text><path d="M650 542L929 542" stroke="#343c31" /><text x="650" y="569" fill="#a4aca0" font-size="15" font-weight="400" class="mono">AI × DESKTOP × WEB</text><path d="M40 604L960 604" stroke="#343c31" /><text x="40" y="633" fill="#a4aca0" font-size="13" font-weight="400" class="mono">EXPLORE THE SYSTEMS BELOW</text><text x="960" y="633" fill="#c4f569" font-size="22" font-weight="400" text-anchor="end">↓</text></g></svg>
